name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: bin/rubocop
      - run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - run: bin/bundler-audit
      - run: yarn audit
  rspec:
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      COVERAGE: "1"
      SE_AVOID_STATS: "true"
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libvips sqlite3
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - name: Read pinned browser version
        id: browser-version
        run: echo "version=$(cat .chrome-version)" >> "$GITHUB_OUTPUT"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ steps.browser-version.outputs.version }}
          install-chromedriver: true
          install-dependencies: true
      - run: bin/setup --skip-server
      - run: yarn build:check
      - run: bin/rails zeitwerk:check
      - run: bin/rails db:test:prepare
      - run: bin/check-exchange-concurrency
      - run: bundle exec rspec --format progress --format RspecJunitFormatter --out tmp/rspec.xml
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-coverage-and-screenshots
          path: |
            tmp/rspec.xml
            tmp/screenshots
            tmp/capybara
            coverage
      - name: Precompile production assets
        run: SECRET_KEY_BASE_DUMMY=1 RAILS_ENV=production bin/rails assets:precompile
